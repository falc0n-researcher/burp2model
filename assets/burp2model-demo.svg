<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-label="burp2model turning a Burp history into a web-app model">
<rect width="760" height="480" rx="14" fill="#0d1117"/>
<circle cx="24" cy="26" r="6" fill="#ff5f56"/>
<circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
<circle cx="68" cy="26" r="6" fill="#27c93f"/>
<text x="380.0" y="30" fill="#8b98a8" font-size="12" text-anchor="middle">burp2model</text>
<text x="28" y="78" fill="#e85002" font-size="15" font-weight="700">$ burp2model burp_history.xml</text>
<rect x="28" y="66" width="0" height="18" fill="#0d1117"><animate attributeName="width" from="360" to="0" dur="1s" fill="freeze"/></rect>
<text x="392" y="78" fill="#3a424e" font-size="15"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>▋</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.00s" fill="freeze"/><text x="40" y="150" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="150" fill="#e6edf3" font-size="14">parse</text><text x="180" y="150" fill="#8b98a8" font-size="13">streaming the burp export</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.90s" fill="freeze"/><text x="40" y="180" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="180" fill="#e6edf3" font-size="14">redact</text><text x="180" y="180" fill="#8b98a8" font-size="13">values masked before any write</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.80s" fill="freeze"/><text x="40" y="210" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="210" fill="#e6edf3" font-size="14">type</text><text x="180" y="210" fill="#8b98a8" font-size="13">routes · scripts · endpoints</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="3.70s" fill="freeze"/><text x="40" y="240" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="240" fill="#e6edf3" font-size="14">relate</text><text x="180" y="240" fill="#8b98a8" font-size="13">observed vs inferred edges</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="4.60s" fill="freeze"/><text x="40" y="270" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="270" fill="#e6edf3" font-size="14">reconcile</text><text x="180" y="270" fill="#8b98a8" font-size="13">code vs runtime</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="5.50s" fill="freeze"/><text x="40" y="300" fill="#4fd1c5" font-size="14">▸</text><text x="66" y="300" fill="#e6edf3" font-size="14">model</text><text x="180" y="300" fill="#8b98a8" font-size="13">an evidence-backed graph</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="6.70s" fill="freeze"/><rect x="28" y="334" width="704" height="96" rx="10" fill="#11161d" stroke="#1e2733"/><text x="44" y="358" fill="#e6edf3" font-size="15" font-weight="700">routes 3 · APIs 10 · edges 58</text><text x="44" y="382" fill="#39d0ff" font-size="13">6 both · 3 runtime-only · </text><text x="225.0" y="382" fill="#e85002" font-size="13" font-weight="700">1 static-only ← look here</text><text x="44" y="406" fill="#9b8cff" font-size="13">3 named unknowns — what the model does not know</text></g>
<text x="380.0" y="456" fill="#8b98a8" font-size="13" text-anchor="middle" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="7.30s" fill="freeze"/>a model your AI reasons over — not a dump it hallucinates on</text>
<rect width="760" height="480" fill="#0d1117" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.93;0.97;1" dur="9.7s" repeatCount="indefinite"/></rect>
</svg>