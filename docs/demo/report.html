:root{
--ink:#fff;--panel:#fff;--panel2:#f7f8fa;--panel3:#fafbfc;--line:#e7eaef;--line2:#cfd5dd;
--text:#141924;--muted:#6b7580;--faint:#98a1ac;--signal:#e85002;--signal-soft:#fdece3;
--observed:#0e8fd6;--inferred:#7a5cff;--ok:#0fa79a;--warn:#c9820a;--bad:#d64545;--hot:#e85002;
--l1:#7a8794;--l2:#0fa79a;--l3:#7a5cff;--l4:#0e8fd6;--l5:#3a424e;--l6:#e85002;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--shadow:0 8px 30px -12px rgba(20,25,36,.22);--radius:12px;
}
html[data-theme="dark"]{
--ink:#0c0f14;--panel:#11151c;--panel2:#141922;--panel3:#0f131a;--line:#222a36;--line2:#2e3846;
--text:#e6edf3;--muted:#93a0b0;--faint:#5f6b7a;--signal:#ff6a1a;--signal-soft:#2a1608;
--observed:#39d0ff;--inferred:#a594ff;--ok:#3fd6c3;--warn:#e2b23c;--bad:#ff6b6b;--hot:#ff6a1a;
--l1:#8a97a6;--l2:#3fd6c3;--l3:#a594ff;--l4:#39d0ff;--l5:#c0cad6;--l6:#ff6a1a;
--shadow:0 12px 40px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--signal);text-decoration:none}
.mono{font-family:var(--mono)}
button{font:inherit;cursor:pointer;color:inherit}
::selection{background:var(--signal);color:#fff}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}

/* header */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;height:58px;
padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font:700 15px var(--mono);letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--signal)}
.logo svg{width:26px;height:26px}
.crumbs{color:var(--muted);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text)}
.search{margin-left:auto;position:relative;flex:0 1 340px}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line2);border-radius:9px;
background:var(--panel2);color:var(--text);font:13px var(--sans)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
.hbtn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.hbtn:hover{border-color:var(--line2)}
.hbtn svg{width:16px;height:16px}
.copyai{position:relative;display:flex}
.btnai{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--signal);border-radius:8px 0 0 8px;background:var(--signal);color:#fff;font:600 13px var(--sans);white-space:nowrap}
.btnai:hover{filter:brightness(1.06)}
.btnai svg{width:15px;height:15px}
.btnai .tok{font:600 10px var(--mono);opacity:.85;padding-left:4px;border-left:1px solid rgba(255,255,255,.35);margin-left:2px}
.btnai.split{padding:0 8px;border-left:1px solid rgba(255,255,255,.35);border-radius:0 8px 8px 0;font-size:11px}
.btnai.done{background:var(--ok);border-color:var(--ok)}
.menu{position:absolute;top:40px;right:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:60}
.menu button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:7px;background:none;color:var(--text)}
.menu button:hover{background:var(--panel2)}
.menu button b{font:600 13px var(--sans)}
.menu button span{color:var(--muted);font-size:11.5px}
.menu button .tk{color:var(--faint);font:600 10px var(--mono)}
.htheme .sun{display:none}html[data-theme="dark"] .htheme .sun{display:block}html[data-theme="dark"] .htheme .moon{display:none}

/* shell */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);height:calc(100% - 58px)}
nav.views{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;overflow:auto}
nav.views h3{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:14px 8px 6px}
nav.views h3:first-child{margin-top:0}
.vbtn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;
color:var(--muted);font:500 13.5px var(--sans);text-align:left;margin-bottom:1px}
.vbtn:hover{background:var(--panel2);color:var(--text)}
.vbtn.on{background:var(--signal-soft);color:var(--signal);font-weight:600}
.vbtn .ct{margin-left:auto;font:600 11px var(--mono);color:var(--faint);background:var(--panel2);padding:1px 7px;border-radius:999px}
.vbtn.on .ct{color:var(--signal);background:#fff}
html[data-theme="dark"] .vbtn.on .ct{background:var(--panel3)}
.vbtn .dot{width:8px;height:8px;border-radius:2px;flex:none}

main{overflow:auto;padding:26px 32px 60px;min-width:0}
.view{display:none}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h1.vt{font:700 24px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 4px}
.vsub{color:var(--muted);margin:0 0 20px;max-width:80ch}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font:700 28px var(--sans);letter-spacing:-.02em;line-height:1}
.kpi .k{color:var(--muted);font-size:12px;margin-top:5px}
.kpi.sig .n{color:var(--signal)}
.kpi.ok .n{color:var(--ok)}

/* cards + tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font:600 13px var(--sans)}
.card>.hd .ct{color:var(--faint);font:600 11px var(--mono)}
.card>.bd{padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;text-align:left;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;
color:var(--muted);background:var(--panel2);padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th .ar{opacity:.4;font-size:9px}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.trunc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 16px;color:var(--faint);text-align:center;font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);padding:2px 8px;border-radius:999px;
border:1px solid currentColor;white-space:nowrap}
.p-both{color:var(--ok)}.p-static{color:var(--inferred)}.p-runtime{color:var(--observed)}
.p-get{color:var(--muted)}.p-post,.p-put,.p-patch,.p-delete{color:var(--signal)}
.m{font:600 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.m.w{color:var(--signal);background:var(--signal-soft)}
.st{font:600 11px var(--mono);padding:1px 6px;border-radius:5px;background:var(--panel2)}
.st.g{color:var(--ok)}.st.r{color:var(--bad)}.st.y{color:var(--warn)}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);padding:5px 11px;border-radius:999px;
border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.chip:hover{border-color:var(--faint);color:var(--text)}
.chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.chip .c{font:600 11px var(--mono);opacity:.7}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg>.lab{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* priorities */
.prio{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--sev);border-radius:10px;
background:var(--panel);margin-bottom:10px;cursor:pointer}
.prio:hover{border-color:var(--line2)}
.prio .rank{font:700 13px var(--mono);color:var(--sev);flex:none;width:22px}
.prio .body{min-width:0;flex:1}
.prio .ttl{font:600 14px var(--sans);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prio .why{color:var(--muted);font-size:13px;margin-top:3px}
.prio .nx{color:var(--text);font-size:12.5px;margin-top:6px}
.prio .nx b{color:var(--signal);font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.sev-hot{--sev:var(--signal)}.sev-warn{--sev:var(--warn)}.sev-info{--sev:var(--observed)}


/* query console */
.tag-ext{font:600 10px var(--mono);letter-spacing:.05em;color:var(--inferred);border:1px solid var(--inferred);border-radius:5px;padding:0 5px}
.icard{margin-bottom:14px}
.icard .bd{padding:0}
.icard td.k{width:190px;color:var(--muted);font:12px var(--mono)}
.icard td.v{font:12.5px var(--mono);overflow-wrap:anywhere}
.miss{color:var(--warn)}

/* unknowns list */
.unk{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.unk .ut{font:600 12px var(--mono);color:var(--signal);letter-spacing:.03em}
.unk .ue{font:600 14px var(--sans);margin:4px 0}
.unk ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.unk .nx{margin-top:8px;font-size:12.5px}.unk .nx b{color:var(--signal);font:600 10px var(--mono);text-transform:uppercase;margin-right:6px}

/* matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;min-width:42px;font:600 11px var(--mono);padding:2px 6px;border-radius:5px}
.cell.hit{background:var(--signal-soft);color:var(--signal)}
.cell.miss{color:var(--faint)}

/* ask (AI-off query) */
.askbar{position:relative;margin-bottom:14px}
.askbar input{width:100%;height:52px;padding:0 18px 0 46px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--text);font:16px var(--sans)}
.askbar input:focus{border-color:var(--signal);outline:none}
.askbar svg{position:absolute;left:16px;top:17px;width:18px;height:18px;color:var(--faint)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.preset{font:500 13px var(--sans);padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.preset:hover{border-color:var(--faint);color:var(--text)}
.answer .ahd{font:600 15px var(--sans);margin:0 0 12px}
.answer .arow{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer}
.answer .arow:hover{border-color:var(--line2);background:var(--panel2)}
.answer .arow .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer .arow .ev{font:600 11px var(--mono);color:var(--faint)}
.answer .note{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:70ch}
.askfoot{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font:500 12.5px var(--sans)}
.askfoot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,25,36,.35);opacity:0;visibility:hidden;transition:.18s;z-index:50}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(720px,94vw);background:var(--panel);border-left:1px solid var(--line);
box-shadow:var(--shadow);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:51;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh .x{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
.drawer .db{overflow:auto;padding:18px}
.drv{height:560px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drawer h4{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
.drawer h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-word}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.taglist span{font:500 12px var(--mono);padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--text)}
.foot{color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding:16px 0 0;margin-top:24px}
.callout{display:flex;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:18px}
.callout .i{color:var(--signal);font:700 13px var(--mono);flex:none}
.callout p{margin:0;color:var(--muted);font-size:13px}
.hide{display:none!important}

/* stacked distribution bars (overview) */
.segbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--panel2);margin:10px 0 8px}
.segbar span{display:block;height:100%}
.seglegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.seglegend .k{display:inline-flex;align-items:center;gap:6px}
.seglegend .sw{width:9px;height:9px;border-radius:3px}
.seglegend b{color:var(--text);font:600 12px var(--mono)}

/* grouped priority signals */
.prio .sig{display:flex;gap:8px;color:var(--muted);font-size:13px;margin-top:5px;align-items:baseline}
.prio .sig::before{content:"›";color:var(--sev);font-weight:700;flex:none}
.prio .sig b{color:var(--text);font-weight:600}


/* dashboard */
/* at a glance: screenshot, infrastructure, stack */
.band{display:grid;gap:18px;align-items:start;margin-bottom:24px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.band.shot{grid-template-columns:minmax(0,.95fr) minmax(0,.9fr) minmax(0,1.3fr)}
@media(max-width:1250px){.band.shot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.band.shot .shotcard{grid-column:1/-1}}
@media(max-width:900px){.band,.band.shot{grid-template-columns:minmax(0,1fr)}}
.shotcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.shotcard .sbar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.shotcard .sbar i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.shotcard .sbar span{margin-left:8px;flex:1;font:11.5px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shotcard button.simg{border:0;padding:0;background:var(--ink);cursor:zoom-in;flex:1;min-height:200px;display:block}
.shotcard img{width:100%;height:100%;min-height:200px;max-height:340px;object-fit:cover;object-position:top;display:block}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(10,13,18,.82);display:grid;place-items:center;padding:30px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:var(--shadow)}
.irows{display:grid;grid-template-columns:104px minmax(0,1fr);gap:0}
.irows .k{color:var(--muted);font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.irows .v{font:12.5px var(--mono);padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.irows .k:nth-last-child(2),.irows .v:last-child{border-bottom:0}
.irows .v small{color:var(--faint);margin-left:6px}
.smap{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:12px}
.smap .sn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:96px;display:flex;flex-direction:column;gap:5px;align-self:stretch}
.smap .sn.you{justify-content:center;align-items:center;font:600 12px var(--mono);color:var(--muted);min-width:70px}
.smap .sl{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.smap .sa{display:grid;place-items:center;width:24px;color:var(--faint);font-size:15px}
.tp{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--sans);padding:3px 4px 3px 0;border:0;background:none;color:var(--text);text-align:left}
.tp i{width:8px;height:8px;border-radius:2px;flex:none}
.tp small{color:var(--faint);font:500 10.5px var(--mono)}
.tp:hover{color:var(--signal)}
.svc{margin-top:14px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;align-items:baseline}
.svc .sk{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.svc .sv{display:flex;flex-wrap:wrap;gap:4px 14px}
.m-overview{padding:26px 32px 60px}
.ovh{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:26px}
@media(max-width:1000px){.ovh{grid-template-columns:minmax(0,1fr)}}
.ovh h1{font:700 30px/1.1 var(--sans);letter-spacing:-.025em;margin:0 0 8px}
.ovh .sum{font-size:16px;line-height:1.55;color:var(--muted);max-width:62ch;margin:0}
.ovh .sum b{color:var(--text);font-weight:700}
.ovh .meta{color:var(--faint);font:12px var(--mono);margin-top:10px}
.big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.big4 button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;text-align:left;cursor:pointer}
.big4 button:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.big4 .n{font:700 32px/1 var(--sans);letter-spacing:-.03em}
.big4 .k{font-size:12px;color:var(--muted);margin-top:6px}
.big4 .hot .n{color:var(--signal)}
.ovg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-bottom:22px}
@media(max-width:1100px){.ovg{grid-template-columns:minmax(0,1fr)}}
.sech{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sech h2{font:700 16px var(--sans);margin:0;letter-spacing:-.01em}
.sech .s{color:var(--faint);font-size:12.5px}
.sech .lnk{margin-left:auto;font:600 12.5px var(--sans);color:var(--signal);background:none;border:0}
.lead{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--signal));border-radius:12px;padding:14px 16px;margin-bottom:10px}
.lead .num{font:700 14px var(--mono);color:var(--c,var(--signal));padding-top:2px}
.lead .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 14px var(--mono);word-break:break-all}
.lead .w{font:600 13px var(--sans);margin-top:4px}
.lead .y{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:80ch}
.lead .nx{font-size:12.5px;margin-top:6px;color:var(--text)}
.lead .nx b{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--signal));margin-right:6px}
.lead .acts{display:flex;flex-direction:column;gap:6px}
.abtn{font:600 12px var(--sans);padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);white-space:nowrap}
.abtn:hover{color:var(--text);border-color:var(--faint)}
.abtn.pri{background:var(--text);color:var(--ink);border-color:var(--text)}
@media(max-width:700px){.lead{grid-template-columns:24px minmax(0,1fr)}.lead .acts{grid-column:2;flex-direction:row}}
.side{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--signal);box-shadow:var(--shadow)}
.tile b{display:block;font:700 14.5px var(--sans);margin-bottom:4px}
.tile span{color:var(--muted);font-size:12.5px}
details.more{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:18px}
details.more>summary{cursor:pointer;list-style:none;padding:14px 18px;font:700 14px var(--sans);display:flex;gap:10px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";color:var(--faint);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary span{font-weight:500;color:var(--faint);font-size:12.5px}
details.more .inner{padding:0 18px 18px}
.dh1{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.dh1 h1{font:700 28px/1.1 var(--sans);letter-spacing:-.025em;margin:0}
.dh1 .sub{color:var(--muted);font:12.5px var(--mono);margin-top:6px}
.dh1 .sp{flex:1}
.dtags{display:flex;gap:6px;flex-wrap:wrap}
.dtag{font:600 11px var(--mono);padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.dtag b{color:var(--text)}
.dkpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:1180px){.dkpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.dkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dk{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px 13px;overflow:hidden;cursor:pointer;
transition:transform .12s,border-color .12s,box-shadow .12s}
.dk:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.dk::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--line2))}
.dk .n{font:700 32px/1 var(--sans);letter-spacing:-.03em}
.dk .k{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.dk .s{color:var(--faint);font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgrid{display:grid;gap:14px;margin-bottom:14px}
.dg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dg2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.dg21{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1100px){.dg3,.dg2,.dg21{grid-template-columns:minmax(0,1fr)}}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.dc>.h{display:flex;align-items:center;gap:8px;padding:13px 16px 0;font:600 13px var(--sans)}
.dc>.h .ct{margin-left:auto;color:var(--faint);font:600 11px var(--mono)}
.dc>.h .lnk{margin-left:auto;font:600 12px var(--sans);color:var(--signal);background:none;border:0;padding:0}
.dc>.b{padding:14px 16px 16px;flex:1;min-width:0}
.dnote{color:var(--faint);font-size:11.5px;margin-top:10px}
/* donut */
.dwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut text{font-family:var(--sans)}
.dleg{display:flex;flex-direction:column;gap:9px;min-width:150px;flex:1}
.dleg .r{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.dleg .r:hover b{color:var(--signal)}
.dleg .sw{width:10px;height:10px;border-radius:3px;flex:none}
.dleg .l{color:var(--muted);flex:1}
.dleg b{font:600 13px var(--mono)}
.dleg .pc{color:var(--faint);font:11px var(--mono);width:38px;text-align:right}
/* bars */
.hb{display:flex;flex-direction:column;gap:8px}
.hb .r{display:grid;grid-template-columns:minmax(80px,38%) minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12.5px;cursor:pointer}
.hb .r .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-family:var(--mono);font-size:12px}
.hb .r .t{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden}
.hb .r .t i{display:block;height:100%;border-radius:999px;background:var(--c,var(--observed));transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.hb .r .v{font:600 12px var(--mono);color:var(--muted);text-align:right}
.hb .r:hover .l{color:var(--signal)}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.hb .r .t i{animation:none}.view.on{animation:none}}
.hb.sm .r{grid-template-columns:54px minmax(0,1fr) 44px}
.hb.wide .r{grid-template-columns:minmax(110px,52%) minmax(0,1fr) 40px}
.hb.wide .r .l{font-family:var(--sans);font-size:12.5px}
/* stacked */
.stk{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--panel2)}
.stk i{display:block;height:100%}
.stkleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.stkleg .k{display:inline-flex;gap:6px;align-items:center}

/* attention */
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.att .a{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;cursor:pointer;background:var(--panel2);border-top:3px solid var(--c)}

.att .a .k{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dlist .it{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dlist .it:last-child{border-bottom:0;padding-bottom:0}
.dlist .it:first-child{padding-top:0}
.dlist .rk{font:700 12px var(--mono);color:var(--c,var(--signal));width:18px;flex:none;padding-top:2px}

.dlist .ds{color:var(--muted);font-size:12px;margin-top:2px}
.dlist .it:hover .tt .p{color:var(--signal)}
.sevd{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;margin-top:6px}
/* layer strip */
.lstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-bottom:14px}

.ls{padding:14px 16px;border-right:1px solid var(--line);position:relative;cursor:pointer}

.ls .ln::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.ls .n{font:700 24px/1.1 var(--sans);margin-top:8px;letter-spacing:-.02em}
.ls .d{color:var(--faint);font-size:11.5px;margin-top:3px}
/* capture strip */
.cstrip{width:100%;height:56px;display:block}
.cstrip rect{shape-rendering:crispEdges}
.rolebar{display:flex;margin-top:6px;height:22px;border-radius:6px;overflow:hidden;font:600 10.5px var(--mono)}
.rolebar span{display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;min-width:0}

.dtbl tr{cursor:pointer}.dtbl tbody tr:hover{background:none}.dtbl tr:hover td:first-child{color:var(--signal)}
.okt{color:var(--ok)}.badt{color:var(--bad)}.wrnt{color:var(--warn)}


/* request / response viewer */
.rr{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--panel)}
.rrbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel2);flex:none}
.rrbar .rrt{font:600 12.5px var(--sans);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rrchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rrchip{font:600 11px var(--mono);padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.rrchip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.rrchip:hover{border-color:var(--faint);color:var(--text)}
.rrbar .sp{flex:1}
.rrpanes{display:flex;flex:1;min-height:0}
.rr.vert .rrpanes{flex-direction:column}
.rrp{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.rrp:last-child{border:0}
.rr.vert .rrp{border-right:0;border-bottom:1px solid var(--line)}
.rrp .ph{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel2);border-bottom:1px solid var(--line);flex:none}
.rrp .ph b{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.rrp .ph .st{font:600 11px var(--mono);color:var(--muted)}
.rrp .ph .tag{font:600 10px var(--mono);color:var(--inferred);border:1px solid var(--inferred);border-radius:4px;padding:0 5px}
.rrp .ph .sp{flex:1}
.rrp .code{flex:1;margin:0;overflow:auto;padding:8px 0;font:12px/1.55 var(--mono);background:var(--panel);counter-reset:l}
.rrp .code .l{display:block;padding:0 12px 0 52px;position:relative;white-space:pre-wrap;word-break:break-all;min-height:1.55em}
.rrp .code .l::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:40px;text-align:right;color:var(--faint);font-size:11px;user-select:none}
.rrp .code.nol .l{padding-left:12px}.rrp .code.nol .l::before{display:none}
.rrp .ln{color:var(--signal);font-weight:700}.rrp .hn{color:var(--observed)}.rrp .hv{color:var(--text)}.rrp .rd{color:var(--inferred);font-weight:700}
.rrp .tk{color:var(--signal);font-weight:600}.rrp .ts{color:var(--ok)}.rrp .tc{color:var(--faint);font-style:italic}.rrp .tn{color:var(--warn)}.rrp .tg{color:var(--observed)}.rrp .ta{color:var(--inferred)}
.rrp .jk{color:var(--observed)}.rrp .js{color:var(--ok)}.rrp .jn{color:var(--warn)}.rrp .jb{color:var(--inferred)}
.rrp .note{color:var(--faint);font-style:italic}
.rrp .gap{height:8px}
.rrempty{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:var(--faint);font-size:13px;background:var(--panel)}
.rrempty b{display:block;color:var(--muted);font:600 14px var(--sans);margin-bottom:4px}
.rrbtn{font:600 11px var(--mono);padding:3px 8px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.rrbtn:hover{color:var(--text)}


/* split pages: content on top, viewer below */
.m-priorities,.m-reference,.m-ask{padding:0!important;overflow:hidden!important}
.m-priorities .view,.m-reference .view,.m-ask .view{max-width:none;height:100%}
.m-priorities .foot,.m-reference .foot,.m-ask .foot{display:none}
.splitpg{display:flex;flex-direction:column;height:100%;min-height:0}
.splitpg .top{flex:1 1 auto;min-height:140px;overflow:auto;padding:24px 32px 28px}
.splitpg .gut{height:4px;flex:none;background:var(--line);cursor:row-resize;position:relative;z-index:2}

.splitpg .bot{flex:none;min-height:190px;max-height:80%;border-top:1px solid var(--line);background:var(--panel)}
.splitpg .gut[hidden],.splitpg .bot[hidden]{display:none}
.rrnote{font:500 11.5px var(--sans);color:var(--faint);font-style:italic}
.rrp .code .l.hit{background:var(--signal-soft);box-shadow:inset 3px 0 var(--signal)}
.ptab{font:600 11px var(--mono);padding:3px 9px;border-radius:5px;border:1px solid transparent;background:none;color:var(--muted)}
.ptab.on{background:var(--panel);border-color:var(--line2);color:var(--text)}
.arow.sel{background:var(--signal-soft);border-color:var(--signal)}
.qtab tr.sel{background:var(--signal-soft);box-shadow:inset 3px 0 var(--signal)}
/* tabs and chips */
.tabs{display:flex;gap:4px;margin:6px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{font:600 13px var(--sans);padding:9px 16px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--signal)}
.tabs button .n{font:600 11px var(--mono);color:var(--faint);margin-left:6px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{font:600 12px var(--sans);padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.fchip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.fchip .n{font:600 11px var(--mono);margin-left:5px;opacity:.7}
/* leads */
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:13px 16px 12px 12px;margin-bottom:9px;cursor:pointer}

.lrow.sel{background:var(--panel2);border-color:var(--c);box-shadow:var(--shadow)}

.lrow .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lrow .p{font:700 13.5px var(--mono);word-break:break-all}
.lrow .sevb{font:700 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:1px 6px}
.lrow .w{font:600 13.5px var(--sans);margin-top:5px}
.lrow .y{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:90ch}
.lrow .nx{font-size:12.5px;margin-top:6px}
.lrow .nx b{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-right:6px}
.lrow .more{color:var(--faint);font-size:12px;margin-top:4px}
.sev-hot{--c:var(--signal)}.sev-warn{--c:var(--warn)}.sev-info{--c:var(--observed)}
/* open questions */
.qgrp{margin:18px 0 8px;font:700 13px var(--display,var(--sans));display:flex;gap:8px;align-items:baseline}
.qgrp .n{font:600 11px var(--mono);color:var(--faint)}
.qrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.qrow:hover{border-color:var(--line2)}
.qrow.sel{background:var(--panel2);border-color:var(--l6)}
.qrow .e{font:700 13px var(--mono);word-break:break-all}
.qrow ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
.qrow .un{color:var(--l6)}
.qrow .nx{margin-top:7px;font-size:12.5px}
.qrow .nx b{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--l6);margin-right:6px}
/* reference: the layered chart */
.splitpg .top.refpg{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.refhd{flex:none}
.refgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,460px) minmax(0,1fr);gap:30px}
.refl,.refr{min-height:0;overflow:auto;padding-bottom:24px}
@media(max-width:1000px){.splitpg .top.refpg{overflow:auto}.refgrid{grid-template-columns:minmax(0,1fr)}.refl,.refr{overflow:visible}}
.sunwrap{position:relative;width:min(460px,100%,calc(58vh - 190px));min-width:260px;margin:0 auto 12px}
.sunwrap svg{width:100%;height:auto;display:block}
.sun path{stroke:var(--panel);stroke-width:1.2;cursor:pointer;transition:opacity .12s}
.sun path:hover{opacity:.82}
.sun path.pick{stroke:var(--text);stroke-width:2.2}
.sun text{font:600 10.5px var(--sans);fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px}
.sun .ctr{fill:var(--panel);stroke:var(--line2);stroke-width:1.5;cursor:pointer}
.sun .ctr:hover{fill:var(--panel2)}
.sun .ct1{font:700 15px var(--display,var(--sans));fill:var(--text);stroke:none;text-anchor:middle}
.sun .ct2{font:500 10.5px var(--sans);fill:var(--muted);stroke:none;text-anchor:middle}
.suntip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:6px 10px;font:12px var(--mono);display:none;z-index:4;max-width:280px}
.suntip b{display:block;font:700 12.5px var(--mono);word-break:break-all}
.suntip span{color:var(--muted);font-size:11px}
.crumbs2{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font:600 12px var(--mono);color:var(--muted);margin-bottom:10px}
.crumbs2 button{border:0;background:none;color:var(--muted);font:inherit;padding:2px 4px;border-radius:5px}
.crumbs2 button:hover{color:var(--signal)}
.crumbs2 .cur{color:var(--text)}
.reft h2{font:700 24px var(--display,var(--sans));letter-spacing:-.03em;margin:0 0 6px}
.reft p{color:var(--muted);font-size:14px;line-height:1.6;max-width:62ch;margin:0 0 14px}
.refkids{display:flex;gap:8px;flex-wrap:wrap}
.refkid{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--sans);padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
.refkid:hover{border-color:var(--signal)}
.refkid i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.refkid .n{font:600 11px var(--mono);color:var(--faint)}
.layers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.layer{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer}
.layer:hover{border-color:var(--c);box-shadow:var(--shadow)}
.layer{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.layer .nn{font:700 26px var(--display,var(--sans));letter-spacing:-.03em}
.layer b{display:block;font:700 13.5px var(--sans);margin:2px 0}
.layer span{color:var(--muted);font-size:12.5px}
.dtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dtable th{position:static;text-align:left;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2);padding:8px 12px;border-bottom:1px solid var(--line);cursor:default}

.dtable tbody tr{cursor:pointer}

.dhead{display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap}

.dhead .n{color:var(--faint);font:600 12px var(--mono)}
.dhead input{margin-left:auto;height:32px;min-width:220px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--text);font:12.5px var(--mono)}
.dhead input:focus{border-color:var(--signal);outline:none}
.pickinfo{margin:12px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.dsec{margin-bottom:22px}
.stackrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:18px}


/* inventory (Burp-style) */
.m-inventory{padding:0!important;overflow:hidden!important;display:flex;flex-direction:column}
.m-inventory .view{max-width:none;flex:1;min-height:0;display:flex;flex-direction:column}

.inv{display:flex;flex-direction:column;flex:1;min-height:0}
.inv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.inv-bar h1{font:700 15px var(--sans);margin:0 6px 0 0;letter-spacing:-.01em}
.inv-q{position:relative;flex:1 1 280px;min-width:200px;max-width:560px}
.inv-q input{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--text);font:12.5px var(--mono)}

.inv-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ichip{font:600 11px var(--mono);padding:4px 9px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
.ichip:hover{color:var(--text);border-color:var(--faint)}

.ichip.s2.on{background:var(--ok);border-color:var(--ok);color:#fff}.ichip.s3.on{background:var(--observed);border-color:var(--observed);color:#fff}
.ichip.s4.on{background:var(--warn);border-color:var(--warn);color:#fff}.ichip.s5.on{background:var(--bad);border-color:var(--bad);color:#fff}
.inv-bar select{height:30px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--text);font:600 11px var(--mono);padding:0 6px}

.inv-main{display:flex;flex:1;min-height:0;background:var(--ink)}
.inv-tree{width:var(--tw,250px);min-width:150px;max-width:60%;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 0;font:12px var(--mono);flex:none}
.tn{display:flex;align-items:center;gap:5px;padding:3px 8px 3px calc(8px + var(--d,0)*14px);cursor:pointer;white-space:nowrap;border-left:2px solid transparent}
.tn:hover{background:var(--panel2)}

.inv-gut{flex:none;background:var(--line);position:relative;z-index:2}

.inv-gut:hover,.inv-gut.drag{background:var(--signal)}
.inv-right{flex:1;min-width:0;display:flex;flex-direction:column}
.inv-tbl{display:flex;flex-direction:column;min-height:90px;background:var(--panel)}
.th{display:grid;grid-template-columns:var(--cols);align-items:stretch;background:var(--panel2);border-bottom:1px solid var(--line);flex:none;font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);user-select:none}

.tr .c-status{font-weight:700}.tr .c-status.g{color:var(--ok)}.tr .c-status.y{color:var(--warn)}.tr .c-status.r{color:var(--bad)}.tr .c-status.b{color:var(--observed)}

const SEV_RANK={hot:0,warn:1,info:2};

  const sig=[];

    why:"The client code names this endpoint but no request to it was captured, so nobody has walked this path.",
    next:"Request it directly in an authorised session and observe the response."});
  if(e.privileged&&e.requests>0) sig.push({sev:"hot",ttl:"Privileged-looking path was reached",
    why:"The path matches an admin/internal pattern and appears in the capture"+(e.roles.length?` (roles: ${e.roles.join(", ")})`:"")+".",
    next:"Confirm the response was meant for the caller; replay across accounts."});
  else if(e.privileged) sig.push({sev:"hot",ttl:"Privileged-looking path referenced",
    why:"The path matches an admin/internal pattern; it was only referenced in code, never requested.",
    next:"Request it in an authorised session and observe who is allowed in."});
  const ss=e.statuses||[];
  if(ss.length&&ss.every(s=>s>=400)) sig.push({sev:"warn",ttl:"Only ever returned errors",
    why:`Every observed status was ${ss.join(", ")} so behaviour with valid input or auth has not been seen.`,
    next:"Exercise the feature normally in an authorised session."});
  if(e.anon) sig.push({sev:"warn",ttl:"Seen with and without credentials",
    why:"Some requests carried a credential and some did not, so it is unclear whether auth is required.",

   ${svc.length?`<div class="svc">${[...kinds.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,ts])=>`<span class="sk">${esc(k)}</span><span class="sv">${ts.map(techPill).join("")}</span>`).join("")}</div>`:""}

function infraRows(){

/* one bar per request in capture order, coloured by status class; long captures are bucketed */
function captureStrip(){
  const n=EVL.length;if(!n)return '<div class="empty">No requests.</div>';
  const W=1000,H=56,B=Math.min(n,W),per=n/B;
  let bars="",lastRole=null,runs=[];
  EVL.forEach(e=>{const r=e.role||"—";if(!runs.length||runs[runs.length-1].r!==r)runs.push({r,n:0});runs[runs.length-1].n++;});
  const worst=["5xx","4xx","3xx","2xx","?","1xx"];
  for(let i=0;i<B;i++){
    const a=Math.floor(i*per),b=Math.max(a+1,Math.floor((i+1)*per));let cls="2xx",rank=9;
    for(let k=a;k<b&&k<n;k++){const s=statusClass(EVL[k].status),rr=worst.indexOf(s);if(rr<rank){rank=rr;cls=s;}}
    const h=cls==="5xx"?H:cls==="4xx"?H*.82:cls==="3xx"?H*.62:H*.5;
    bars+=`<rect x="${(i*W/B).toFixed(2)}" y="${(H-h).toFixed(1)}" width="${B<120?(W/B*.8).toFixed(2):(W/B+.35).toFixed(2)}" height="${h.toFixed(1)}" fill="${SC_COL[cls]}" opacity=".85"/>`;
  }
  const rcol=["var(--observed)","var(--inferred)","var(--ok)","var(--signal)","var(--warn)","var(--l2)"];
  const names=[...new Set(runs.map(r=>r.r))];
  const rb=runs.length>1||runs[0].r!=="—"?`<div class="rolebar">${runs.map(r=>`<span style="flex:${r.n};background:${rcol[names.indexOf(r.r)%rcol.length]}" title="${esc(r.r)}: ${r.n} requests">${esc(r.r)}</span>`).join("")}</div>`:"";
  return `<svg class="cstrip" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Requests in capture order, coloured by status">${bars}</svg>${rb}
   <div class="stkleg" style="margin-top:8px"><span class="k"><span class="sw" style="background:var(--ok)"></span>2xx</span><span class="k"><span class="sw" style="background:var(--observed)"></span>3xx</span><span class="k"><span class="sw" style="background:var(--warn)"></span>4xx</span><span class="k"><span class="sw" style="background:var(--bad)"></span>5xx</span></div>`;
}

function ans_endpoint(path){
  const q=path.toLowerCase();const hits=EP.filter(e=>e.path.toLowerCase().includes(q)).sort((a,b)=>a.path.length-b.path.length);
  if(!hits.length)return {title:"No such endpoint",html:`<div class="answer"><p class="note">Nothing in the model matches <span class="mono">${esc(path)}</span>. The model can only answer for endpoints it actually holds, that's the point.</p></div>`};
  return {title:"Endpoint",html:`<div class="answer">${hits.slice(0,6).map(e=>{
    const bits=[];if(e.statuses.length)bits.push("status "+e.statuses.join("/"));if(e.params.length)bits.push(e.params.length+" params");if(e.referenced_by.length)bits.push("referenced by "+e.referenced_by.join(", "));if(e.called_from.length)bits.push("called from "+e.called_from.join(", "));

function ans_shape(){const c2=D.counts;return {title:D.app,html:`<div class="answer"><p class="note"><b>${esc(D.app)}</b>, ${c2.hosts} host${c2.hosts===1?"":"s"}, ${c2.routes} route${c2.routes===1?"":"s"}, <b>${c2.endpoints} endpoints</b>, ${c2.parameters} parameters, ${c2.third_parties} third part${c2.third_parties===1?"y":"ies"}, ${c2.unknowns} open question${c2.unknowns===1?"":"s"}. Ask about any of them, or open the Map.</p></div>`};}
function askEngine(q){
  q=(q||"").toLowerCase().trim();
  if(!q)return ans_shape();
  const p=q.match(/\/[a-z0-9_\-{}\/.]+/i);if(p)return ans_endpoint(p[0]);
  if(/(in ?code|referenced|static).*(never|not|un).*(call|walk|use)|never called|unwalked|only in code/.test(q))return ans_incode();
  if(/error|fail|4\d\d|5\d\d|broken/.test(q))return ans_errors();
  if(/admin|privileg|internal|manage/.test(q))return ans_priv();
  if(/third|vendor|external|supply|dependen/.test(q))return ans_thirdparty();
  if(/auth|login|cookie|session|credential|token|sign ?in/.test(q))return ans_auth();
  if(/unknown|open question|couldn'?t|can'?t see|don'?t know|what.*miss|gap/.test(q))return ans_unknowns();
  if(/param|field|input|argument/.test(q)){const r=EP.filter(e=>e.params.length).sort((a,b)=>b.params.length-a.params.length);return alist("Endpoints with parameters",`Parameter <b>names</b> only, values were masked at capture.`,r.map(e=>`<div class="arow" data-ep="${esc(e.id)}">${methodm(e.method)}<span class="p mono">${esc(e.path)}</span><span class="ev">${e.params.length}</span>${ARROW}</div>`));}
  if(/endpoint|api|route|url|path|list|what.*(exist|there)|surface/.test(q))return ans_endpoints();
  return ans_shape();
}

/* syntax colouring: one pass, tokens never overlap */
function qHighlight(t){
  const re=/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b([A-Za-z_][\w.\-]*)(:)("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|[^\s()]*)|\b(AND|OR|NOT)\b|\b(reach|blast|upstream|neighbors|path|osint|unknowns|stats|help|limit|depth|to)\b|(\d+)|([()])/g;
  let out="",i=0,m;
  while((m=re.exec(t))){
    out+=esc(t.slice(i,m.index));i=re.lastIndex;
    if(m[1])out+=`<span class="v">${esc(m[1])}</span>`;
    else if(m[2]){const parts=m[2].split(".");let op="";if(parts.length>1&&Q_OPS.some(o=>o[0]===parts[parts.length-1]))op=parts.pop();
      out+=`<span class="f">${esc(parts.join("."))}</span>${op?`<span class="o">.${esc(op)}</span>`:""}<span class="p">:</span><span class="${/^["']/.test(m[4])||isNaN(+m[4])?"v":"n"}">${esc(m[4])}</span>`;}
    else if(m[5])out+=`<span class="k">${m[5]}</span>`;
    else if(m[6])out+=`<span class="vb">${m[6]}</span>`;
    else if(m[7])out+=`<span class="n">${m[7]}</span>`;
    else out+=`<span class="p">${esc(m[8])}</span>`;
  }
  return out+esc(t.slice(i))+"\n";
}

      const fieldish=/^(req|resp|node|edge|role|id)\b/i.test(word),first=left.trim()===word&&word.length>=2;
      if(hasColon){const f=word.replace(/\.(cont|ncont|eq|ne|like|regex|gt|gte|lt|lte)$/,"");
        items=qValues(f).filter(x=>x.toLowerCase().startsWith(val.toLowerCase())&&x!==val).slice(0,8).map(x=>({ins:/\s/.test(x)?'"'+x+'"':x,lab:x,d:"value",at:pos-val.length,end:pos}));}
      else if(fieldish){
        const parts=word.split("."),last=parts[parts.length-1],base=parts.slice(0,-1).join(".");
        if(parts.length>1&&Q_FIELDS.some(f=>f[0]===base)&&!Q_OPS.some(o=>o[0]===last)&&base!=="node.attr")
          items=Q_OPS.filter(o=>o[0].startsWith(last)&&o[0]!==last).map(o=>({ins:o[0]+":",lab:base+"."+o[0],d:o[1],at:pos-last.length,end:pos}));
        if(!items.length)items=Q_FIELDS.filter(f=>f[0].toLowerCase().startsWith(word.toLowerCase())&&f[0].toLowerCase()!==word.toLowerCase()).slice(0,8)
          .map(f=>({ins:f[0]+(f[0].endsWith(".")?"":":"),lab:f[0],d:f[1],at:pos-word.length,end:pos}));
      }else if(first)items=Q_VERBS.filter(f=>/^[a-z]/.test(f[0])&&f[0].startsWith(word.toLowerCase())&&f[0]!==word.toLowerCase()).slice(0,6).map(f=>({ins:f[0]+" ",lab:f[0],d:f[1],at:pos-word.length,end:pos}));
    }
    sel=0;
    if(!items.length){ac.hidden=true;return;}
    ac.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${i===sel?"on":""}"><span>${esc(it.lab)}</span><span class="dd">${esc(it.d)}</span></button>`).join("");
    ac.hidden=false;
    $$("button",ac).forEach(b=>b.onmousedown=e=>{e.preventDefault();accept(+b.dataset.i);});
  }
  function accept(i){const it=items[i];if(!it)return;const v=inp.value;inp.value=v.slice(0,it.at)+it.ins+v.slice(it.end);const p=it.at+it.ins.length;inp.setSelectionRange(p,p);ac.hidden=true;paint();suggest();}
  function mark(){$$("button",ac).forEach((b,i)=>b.classList.toggle("on",i===sel));const b=$$("button",ac)[sel];if(b)b.scrollIntoView({block:"nearest"});}
  inp.addEventListener("input",()=>{paint();suggest();});
  inp.addEventListener("scroll",()=>{hl.scrollTop=inp.scrollTop;});
  inp.addEventListener("click",()=>{ac.hidden=true;});
  inp.addEventListener("blur",()=>setTimeout(()=>{ac.hidden=true;},120));
  inp.addEventListener("keydown",e=>{
    if(!ac.hidden){
      if(e.key==="ArrowDown"){e.preventDefault();sel=(sel+1)%items.length;mark();return;}
      if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+items.length)%items.length;mark();return;}
      if(e.key==="Tab"){e.preventDefault();accept(sel);return;}
      if(e.key==="Escape"){ac.hidden=true;return;}
    }
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go();}
  });
  function wire(){
    const o=$("#qout");
    const mark=el=>{$$(".sel",o).forEach(x=>x.classList.remove("sel"));el.classList.add("sel");};
    $$("[data-ep]",o).forEach(el=>el.onclick=()=>{const e=EP.find(x=>x.id===el.dataset.ep);if(!e)return;mark(el);
      splitShow(e.evidence,{title:e.label,find:e.state==="STATIC_ONLY"?e.path:null,empty:{head:"Not requested",text:"The code names this endpoint but nothing in the capture called it."}});});
    $$("[data-ev]",o).forEach(r=>r.onclick=()=>{mark(r);splitShow([+r.dataset.ev],{});});
    $$("[data-node]",o).forEach(r=>r.onclick=()=>{mark(r);const id=r.dataset.node,ep=EP.find(x=>x.id===id),n=(D.graph.nodes||[]).find(x=>x.id===id);
      splitShow((ep&&ep.evidence)||(n&&n.evidence)||[],{title:(n&&n.label)||id,empty:{head:"Nothing to open",text:"This node has no request of its own."}});});
    $$("[data-sk]",o).forEach(h=>h.onclick=()=>{const k=h.dataset.sk;qSort=qSort&&qSort.k===k?{k,d:-qSort.d}:{k,d:1};out();});
    $$("[data-add]",o).forEach(b=>b.onclick=()=>{inp.value=inp.value.replace(/\s+limit\s+\d+\s*$/i,"").trim()+" AND "+b.dataset.add;paint();go();});
    const cj=$("#qcopyj");if(cj)cj.onclick=()=>fallbackCopy(JSON.stringify(qRes,null,2),()=>{cj.textContent="Copied";setTimeout(()=>cj.textContent="Copy JSON",1200);});
    const cv=$("#qcsv");if(cv)cv.onclick=()=>qDownload((D.app||"query")+".bql.csv",qCsv(qRes),"text/csv");
    const first=$("[data-ep],[data-ev],[data-node]",o);
    if(first)first.click();else splitShow([]);
  }
  $("#qgo").onclick=go;
  $$("[data-atab]").forEach(b=>b.onclick=()=>{aTab=b.dataset.atab;$$(".atab").forEach(x=>x.classList.toggle("on",x===b));$("#achips").innerHTML=aChips();bindChips();});
  function bindChips(){
    $$("[data-nl]",$("#achips")).forEach(b=>b.onclick=()=>{inp.value=b.dataset.nl;ask(b.dataset.nl);});
    $$("[data-q]",$("#achips")).forEach(b=>b.onclick=()=>{inp.value=b.dataset.q;ask(b.dataset.q);});
    const h=$("#qhelp");if(h)h.onclick=()=>{aNL=null;qErr=null;qRes={kind:"text",columns:[],rows:[],note:"",total:null};out();};
  }
  bindChips();paint();wire();
  if(!inp.value)inp.focus();
}

function vInfra(){

  if(!B||!B.osint)return `<h1 class="vt">Infrastructure</h1><p class="vsub">External recon: DNS, certificates, subdomains, mail policy, headers.</p><div class="empty">No recon stored. Recon is opt-in: rebuild with <span class="mono">--osint</span>, or run <span class="mono">burp2model osint HOST -w ${esc(D.app)} --yes</span>.</div>`;
  const by={};(B.facts||[]).forEach(f=>{(by[f.section]=by[f.section]||[]).push(f);});
  const order=["dns","tls","http","technology","email_security","registration","ip_geo","files","archive","ports","notes"];
  const titles={dns:"DNS",tls:"TLS certificate",http:"HTTP headers",technology:"Technology",email_security:"Mail authentication",registration:"Registration",ip_geo:"Hosting",files:"robots / security.txt / sitemap",archive:"Web archive",ports:"Open ports",notes:"Notes"};
  const cards=order.filter(k=>by[k]).map(k=>`<div class="card icard"><div class="hd">${esc(titles[k]||k)} <span class="ct">${by[k].length}</span></div><div class="bd"><table><tbody>${by[k].map(f=>`<tr><td class="k">${esc(f.key)}</td><td class="v">${esc(f.value)}</td></tr>`).join("")}</tbody></table></div></div>`).join("");
  const byId=new Map((B.nodes||[]).map(n=>[n.id,n]));
  const seenName=new Set(),subs=[];
  (B.edges||[]).filter(e=>e.type==="SUBDOMAIN_OF"||e.type==="COVERS").forEach(e=>{
    const n=byId.get(e.dst);if(!n||n.type==="wildcard_san"||seenName.has(n.id))return;seenName.add(n.id);
    subs.push({label:n.label,inCapture:n.source==="traffic",via:(n.attrs&&n.attrs.via)||(e.type==="COVERS"?"certificate":"first-party host")});});
  subs.sort((a,b)=>a.inCapture-b.inCapture||a.label.localeCompare(b.label));
  const unseen=subs.filter(n=>!n.inCapture);
  const subCard=subs.length?`<div class="card icard"><div class="hd">Subdomains <span class="ct">${subs.length}</span></div><div class="bd"><table><thead><tr><th>Name</th><th>In your capture?</th><th>Found via</th></tr></thead><tbody>${
    subs.map(n=>`<tr><td class="mono">${esc(n.label)}</td><td class="${n.inCapture?"":"miss"}">${n.inCapture?"yes":"never visited"}</td><td class="mono" style="color:var(--muted)">${esc(n.via)}</td></tr>`).join("")}</tbody></table></div></div>`:"";
  return `<h1 class="vt">Infrastructure <span class="tag-ext">EXTERNAL</span></h1><p class="vsub">Public recon on <b class="mono">${esc(B.osint.host)}</b> (run #${B.osint.id}, ${esc(B.osint.generated_at)}). It lives in the graph as <span class="mono">EXTERNAL</span> edges, a separate provenance from traffic you captured or code that referenced a path. ${unseen.length?`<b>${unseen.length}</b> of ${subs.length} subdomain(s) never appeared in your capture.`:""}</p>${subCard}${cards}`;
}

/* ---------- CROSS-ROLE ---------- */
function vCrossrole(){
  const roles=D.roles||[];
  const reached=EP.filter(e=>e.roles.length);
  let h=`<h1 class="vt">Cross-role surface</h1><p class="vsub">Which role reached which endpoint, and the status each got back. Divergence is a broken-access-control <b>hypothesis</b>, replay across accounts to confirm.</p>`;
  // privileged / divergence highlights — one card per endpoint, notes merged
  const hiBy={};
  const note=(e,t)=>{(hiBy[e.id]=hiBy[e.id]||{e,notes:[]}).notes.push(t);};
  reached.forEach(e=>{
    const sbr=e.status_by_role||{};
    const ok=r=>(sbr[r]||[]).some(s=>s>=200&&s<300);
    if(e.privileged&&e.roles.length) note(e,"privileged path reached by "+e.roles.join(", "));
    roles.forEach(lo=>roles.forEach(hiR=>{if(lo!==hiR&&(sbr[lo]||[]).some(s=>s===403||s===401)&&ok(hiR))note(e,`${lo} got ${sbr[lo].join("/")}, ${hiR} got ${sbr[hiR].join("/")}`);}));
  });
  const hi=Object.values(hiBy).map(x=>({e:x.e,note:x.notes.join(" · ")}));
  if(hi.length){h+=`<div class="card"><div class="hd">Divergences worth checking <span class="ct">${hi.length}</span></div><div class="bd" style="padding:14px 16px">${hi.map(x=>`<div class="prio sev-hot" data-ep="${esc(x.e.id)}"><div class="rank">⚑</div><div class="body"><div class="ttl">${methodm(x.e.method)} <span class="mono">${esc(x.e.path)}</span></div><div class="why">${esc(x.note)}.</div></div></div>`).join("")}</div></div>`;}
  // matrix
  h+=`<div class="card"><div class="hd">Role reach matrix</div><div class="bd" style="padding:0"><table class="matrix"><thead><tr><th>Endpoint</th>${roles.map(r=>`<th>${esc(r)}</th>`).join("")}</tr></thead><tbody>`;
  h+=reached.filter(e=>matchQ(e)).map(e=>`<tr data-ep="${esc(e.id)}"><td><span class="mono">${methodm(e.method)} ${esc(e.path)}</span></td>${roles.map(r=>{const ss=(e.status_by_role||{})[r];return `<td>${ss?`<span class="cell hit">${ss.join(",")}</span>`:'<span class="cell miss">·</span>'}</td>`;}).join("")}</tr>`).join("");
  h+=`</tbody></table></div></div>`;
  return h;
}

const SPL=(function(){let h=.4;try{const v=parseFloat(localStorage.getItem("b2m-split"));if(v>.15&&v<.8)h=v;}catch(e){}return{h};})();
function splitShell(inner,cls){return `<div class="splitpg" id="splitpg"><div class="top ${cls||""}" id="sptop">${inner}</div><div class="gut" id="spgut" hidden></div><div class="bot" id="spbot" hidden style="height:${Math.round(SPL.h*100)}%"></div></div>`;}
function highlightIn(el,text){
  if(!text)return;
  const lines=[...el.querySelectorAll(".rrp:last-child .code .l")];
  const hit=lines.find(l=>l.textContent.includes(text));
  if(!hit){const t=$(".rrt",el);if(t&&!$(".rrnote",el))t.insertAdjacentHTML("afterend",`<span class="rrnote">${esc(text)} is further into this script than the report keeps</span>`);return;}
  hit.classList.add("hit");
  const box=hit.closest(".code");if(box)box.scrollTop=Math.max(0,hit.offsetTop-box.clientHeight/3);
}
function splitShow(ids,opts){

function splitInit(){

    g.onpointerup=()=>{g.classList.remove("drag");g.onpointermove=g.onpointerup=null;try{localStorage.setItem("b2m-split",String(SPL.h));}catch(e){}};};
}

function refBuild(){
  const routeName=r=>r.label.replace(/^[^/]*/,"")||"/";

  const other=[];[...areas.entries()].forEach(([k,v])=>{if(v.length<2&&areas.size>6){other.push(...v);areas.delete(k);}});
  if(other.length)areas.set("other",other);
  const leaf=(kind,id,name,data,extra)=>Object.assign({kind,id,name,data,value:1},extra||{});
  const nodes=[];
  if((D.routes||[]).length)nodes.push({kind:"pages",id:"pages",name:"Pages",children:D.routes.map(r=>leaf("route","route:"+r.id,routeName(r),r))});
  if((D.scripts||[]).length)nodes.push({kind:"scripts",id:"scripts",name:"Scripts",children:D.scripts.map(s=>leaf("script","script:"+s.id,s.label,s))});
  if(EP.length)nodes.push({kind:"endpoints",id:"endpoints",name:"Endpoints",children:[...areas.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0])).map(([a,es])=>({kind:"area",id:"area:"+a,name:a,children:es.map(e=>leaf("endpoint","ep:"+e.id,(e.method!=="*"?e.method+" ":"")+e.path,e))}))});

    const rank={};cols.forEach(ci=>by[ci].forEach((n,r)=>rank[n.id]=r));

      if(dragN&&moved){const w=toWorld(px,py);dragN.x=dragN.tx=w.x;dragN.y=dragN.ty=w.y;if((MAPS.mode==="force"||MAPS.mode==="net")&&MAPS.sim){dragN.fx=w.x;dragN.fy=w.y;MAPS.sim.alpha=Math.max(MAPS.sim.alpha,.25);}dirty=true;}
      else if(!dragN&&moved){T.x=down.tx+dx;T.y=down.ty+dy;dirty=true;}
      return;}
    const n=pick(px,py);if((n&&n.id)!==hover){hover=n?n.id:null;dirty=true;cv.classList.toggle("hit",!!n);}
    if(n){const ep=EPBY[n.id];tip.style.display="block";tip.style.left=Math.min(W-300,px+14)+"px";tip.style.top=Math.min(H-70,py+14)+"px";
      tip.innerHTML=`<b>${esc(n.label)}</b><span>${esc(KIND_LABEL[n.type]||humanize(n.type))}${ep?" · "+esc(ep.state||""):""}${n.deg?" · "+n.deg+" link"+(n.deg===1?"":"s"):""}</span>`;}
    else tip.style.display="none";});
  cv.addEventListener("pointerup",ev=>{
    if(dragN){dragN.fx=dragN.fy=null;if(!moved){if(ev.shiftKey&&MAPS.sel&&MAPS.sel!==dragN.id){setPath(MAPS.sel,dragN.id);}else{MAPS.path=null;MAPS.sel=dragN.id;if(MAPS.mode==="focus"){MAPS.focusId=dragN.id;layout();fit(true);}}recompute();inspector();dirty=true;}}
    else if(down&&!moved){MAPS.sel=null;MAPS.path=null;recompute();inspector();dirty=true;}
    down=null;dragN=null;cv.classList.remove("drag");});
  cv.addEventListener("pointerleave",()=>{hover=null;tip.style.display="none";dirty=true;});
  cv.addEventListener("wheel",ev=>{ev.preventDefault();const r=cv.getBoundingClientRect();zoomAt(ev.deltaY<0?1.15:1/1.15,ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
  cv.addEventListener("dblclick",ev=>{const r=cv.getBoundingClientRect(),n=pick(ev.clientX-r.left,ev.clientY-r.top);if(n){MAPS.mode="focus";MAPS.focusId=n.id;MAPS.sel=n.id;mapSave();render();}else fit(true);});
  mini.addEventListener("pointerdown",ev=>{const r=mini.getBoundingClientRect(),m=mini._m;if(!m)return;const mx=(ev.clientX-r.left)*(mini.width/r.width),my=(ev.clientY-r.top)*(mini.height/r.height);
    const wx=(mx-m.ox)/m.k,wy=(my-m.oy)/m.k;anim={from:{...T},to:{k:T.k,x:W/2-wx*T.k,y:H/2-wy*T.k},t0:performance.now(),dur:300};dirty=true;});
  $$("[data-z]",wrap).forEach(b=>b.onclick=()=>{const k=b.dataset.z;if(k==="fit")fit(true);else zoomAt(k==="in"?1.3:1/1.3,W/2,H/2);});
  $("#mapx").addEventListener("keydown",ev=>{if(ev.target.tagName==="INPUT")return;
    if(ev.key==="f"||ev.key==="F")fit(true);else if(ev.key==="Escape"){MAPS.sel=null;MAPS.path=null;recompute();inspector();dirty=true;}
    else if(ev.key==="+"||ev.key==="=")zoomAt(1.2,W/2,H/2);else if(ev.key==="-")zoomAt(1/1.2,W/2,H/2);});

  /* ---- toolbar ---- */
  $$("[data-layer]").forEach(b=>b.onclick=()=>{const k=b.dataset.layer;MAPS.hidden.has(k)?MAPS.hidden.delete(k):MAPS.hidden.add(k);mapSave();MAPS.sel=MAPS.path=null;render();});
  $$("[data-es]").forEach(b=>b.onclick=()=>{const k=b.dataset.es;MAPS.edgeOff.has(k)?MAPS.edgeOff.delete(k):MAPS.edgeOff.add(k);mapSave();render();});
  $$("[data-mode]").forEach(b=>b.onclick=()=>{if(MAPS.mode!==b.dataset.mode){MAPS.mode=b.dataset.mode;if(MAPS.mode==="focus"&&MAPS.sel)MAPS.focusId=MAPS.sel;mapSave();render();}});
  $("#mpng").onclick=()=>{const c=document.createElement("canvas");c.width=cv.width*2;c.height=cv.height*2;const x=c.getContext("2d");x.fillStyle=C.ink;x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=(D.app||"model")+".map.png";a.click();URL.revokeObjectURL(u);});};
  /* search with suggestions */
  const sq=$("#msq"),sg=$("#msug");let sgi=0,sgl=[];
  function suggest(){const q=sq.value.trim().toLowerCase();recompute();dirty=true;if(!q){sg.hidden=true;return;}
    sgl=nodes.filter(n=>String(n.label).toLowerCase().includes(q)).sort((a,b)=>String(a.label).toLowerCase().indexOf(q)-String(b.label).toLowerCase().indexOf(q)||b.deg-a.deg).slice(0,8);sgi=0;
    sg.hidden=!sgl.length;sg.innerHTML=sgl.map((n,i)=>`<button data-i="${i}" class="${i?"":"on"}"><span class="sw" style="width:8px;height:8px;border-radius:2px;background:${CAT[n.cat]._c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.label)}</span><span class="k">${esc(n.type)}</span></button>`).join("");
    $$("button",sg).forEach(b=>b.onmousedown=e=>{e.preventDefault();choose(sgl[+b.dataset.i]);});}
  function choose(n){if(!n)return;sg.hidden=true;MAPS.sel=n.id;MAPS.path=null;if(MAPS.mode==="focus"){MAPS.focusId=n.id;layout();fit(true);}else flyTo(n);recompute();inspector();dirty=true;}
  sq.addEventListener("input",suggest);sq.addEventListener("blur",()=>setTimeout(()=>sg.hidden=true,120));
  sq.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();choose(sgl[sgi]);}else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sgi=(sgi+(e.key==="ArrowDown"?1:-1)+sgl.length)%Math.max(1,sgl.length);$$("button",sg).forEach((b,i)=>b.classList.toggle("on",i===sgi));}else if(e.key==="Escape"){sq.value="";suggest();}});

  /* ---- inspector ---- */
  const invKey=n=>{const ep=EPBY[n.id];if(ep&&ep.state!=="STATIC_ONLY")return(ep.host||"")+(ep.path||"").replace(/\/$/,"");if(n.type==="route")return n.id.replace(/^route:/,"").replace(/\/$/,"");if(n.type==="host")return n.label;return null;};
  function inspector(){
    const el=$("#minsp"),n=MAPS.sel?byId.get(MAPS.sel):null;
    if(!n||!nset.has(n.id)){
      const hubs=nodes.slice().sort((a,b)=>b.deg-a.deg).slice(0,8);
      const cnt=CAT.map((c,i)=>[c,nodes.filter(x=>x.cat===i).length]).filter(x=>x[1]);
      el.innerHTML=`<h3>This map</h3><div class="nrows"><div class="k">Nodes</div><div class="v">${nodes.length}</div><div class="k">Edges</div><div class="v">${edges.length}</div>
        <div class="k">Seen in traffic</div><div class="v">${edges.filter(e=>e.state==="OBSERVED").length}</div><div class="k">Found in code</div><div class="v">${edges.filter(e=>e.state==="INFERRED").length}</div>
        ${edges.some(e=>e.state==="EXTERNAL")?`<div class="k">From recon</div><div class="v">${edges.filter(e=>e.state==="EXTERNAL").length}</div>`:""}</div>
       <h3>Most connected</h3>${hubs.map(h=>`<div class="hubrow" data-pick="${esc(h.id)}"><span class="s" style="width:9px;height:9px;border-radius:2px;background:${CAT[h.cat]._c};flex:none"></span><span class="t">${esc(h.label)}</span><span class="d">${h.deg}</span></div>`).join("")}
       <h3>How to read it</h3><div class="tips">Hover a node to trace what it touches. <b>Click</b> to inspect it. <kbd>Shift</kbd>+click a second node to trace the shortest path between them. <b>Double-click</b> a node to focus on it. Drag a node to move it. Scroll to zoom, <kbd>F</kbd> to fit.<br>Solid lines were seen in traffic, dashed lines were found in the code, dotted lines come from recon. A dashed hollow node is an endpoint the code names but no request reached.</div>`;
      $$("[data-pick]",el).forEach(r=>r.onclick=()=>choose(byId.get(r.dataset.pick)));return;
    }
    const ep=EPBY[n.id],cat=CAT[n.cat];
    const groups={};(adj.get(n.id)||[]).forEach(x=>{const k=(x.out?"→ ":"← ")+x.e.type+"|"+x.e.state;(groups[k]=groups[k]||[]).push(x.n);});
    const rows=[];
    if(ep){rows.push(["State",ep.state==="BOTH"?"seen in code and traffic":ep.state==="STATIC_ONLY"?"in code, never called":"traffic only"]);if(ep.statuses.length)rows.push(["Statuses",ep.statuses.join(", ")]);rows.push(["Requests",ep.requests]);if(ep.params.length)rows.push(["Parameters",ep.params.length]);if(ep.roles.length)rows.push(["Roles",ep.roles.join(", ")]);if(ep.credentials.length)rows.push(["Credentials",ep.credentials.join(", ")]);if(ep.privileged)rows.push(["Note","privileged-looking path"]);}
    else if(n.state)rows.push(["State",n.state]);
    if((n.evidence||[]).length)rows.push(["Evidence",n.evidence.slice(0,4).map(EVD).join(", ")+(n.evidence.length>4?" …":"")]);
    if(n.detail)rows.push(["Detail",n.detail]);
    const path=MAPS.path;
    el.innerHTML=`<div class="nh"><span class="ic" style="color:${cat._c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n.type]||ICON.endpoint}"/></svg></span><span class="kind">${esc(KIND_LABEL[n.type]||humanize(n.type))}</span></div>
      <div class="nlabel">${esc(n.label)}</div>
      <div class="nrows">${rows.map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join("")}<div class="k">Links</div><div class="v">${n.deg}</div></div>
      <div class="nact"><button class="mbtn" id="nfocus">Focus</button>${ep||(n.evidence||[]).length?`<button class="mbtn" id="ndet">Details</button>`:""}${BQLDB?`<button class="mbtn" id="nreach">Query reach</button>`:""}${invKey(n)!=null?`<button class="mbtn" id="ninv">Inventory</button>`:""}</div>
      ${path?`<div class="pathbox"><div class="pt">Shortest path</div>${path.ids?path.ids.map((id,i)=>`<div class="conn" data-pick="${esc(id)}"><span class="a">${i?"↳":"●"}</span><span class="t">${esc((byId.get(id)||{}).label||id)}</span></div>`).join(""):`<span style="font-size:12.5px;color:var(--muted)">No path between these two nodes with the current filters.</span>`}</div>`:""}
      ${Object.keys(groups).sort().map(k=>{const [lab,st]=k.split("|");const cls=st==="INFERRED"?"in":st==="EXTERNAL"?"ex":"ob";return `<div class="ghd"><span>${esc(lab.replace(/_/g," ").toLowerCase())}</span><span class="st ${cls}">${st==="INFERRED"?"code":st==="EXTERNAL"?"recon":"traffic"}</span><span>${groups[k].length}</span></div>${groups[k].slice(0,30).map(m=>`<div class="conn" data-pick="${esc(m.id)}"><span class="s" style="background:${CAT[m.cat]._c}"></span><span class="t">${esc(m.label)}</span></div>`).join("")}${groups[k].length>30?`<div class="conn"><span class="t" style="color:var(--faint)">+${groups[k].length-30} more</span></div>`:""}`;}).join("")}`;
    $$("[data-pick]",el).forEach(r=>r.onclick=()=>choose(byId.get(r.dataset.pick)));
    const f=$("#nfocus");if(f)f.onclick=()=>{MAPS.mode="focus";MAPS.focusId=n.id;mapSave();render();};
    const d=$("#ndet");if(d)d.onclick=()=>openNode(n.id);
    const r=$("#nreach");if(r)r.onclick=()=>{if(BQLDB){qRun(`reach "${n.label.replace(/"/g,'\\"')}"`);aNL=null;view="ask";render();}};
    const iv=$("#ninv");if(iv)iv.onclick=()=>{INV.node=invKey(n);INV.q="";INV.sel=null;view="inventory";render();};
  }

  /* ---- go ---- */
  resize();layout();
  nodes.forEach(n=>{n.x=n.tx;n.y=n.ty;});
  if(MAPS.mode==="focus"&&!MAPS.sel&&MAPS.focusId==null){}
  fit(false);recompute();inspector();
  if(MAPS.sel&&nset.has(MAPS.sel)&&MAPS.mode!=="focus"){}
  new ResizeObserver(()=>{resize();}).observe(wrap);
  MAPS.dbg=()=>({T,nodes,W,H});
  MAPS.raf=requestAnimationFrame(frame);
  if(!nodes.length){$("#mhud").textContent="Every layer is hidden. Turn one back on above.";}
}


/* ---------- drawer ---------- */
function openEp(id){
  const e=EP.find(x=>x.id===id);if(!e)return;
  const sbr=e.status_by_role||{};
  const staticOnly=e.state==="STATIC_ONLY";
  const kv=(k,v)=>v!=null&&v!==""&&!(Array.isArray(v)&&!v.length)?`<div class="k">${k}</div><div class="v">${v}</div>`:"";
  $("#dtitle").innerHTML=`${methodm(e.method)} <span class="mono">${esc(e.path)}</span>`;
  $("#dbody").innerHTML=`
   ${staticOnly?`<div class="callout" style="margin-bottom:16px"><span class="i">i</span><p>This endpoint was <b>referenced in the client code but never requested</b> in the capture, so there is no request or response for it. The evidence below is the page or script that names it, a good thing to try next.</p></div>`:""}
   <h4>Attributes</h4><div class="kv">
    ${kv("Host",`<span class="mono">${esc(e.host)}</span>`)}
    ${kv("Statuses",statuses(e.statuses))}${kv("Requests",e.requests)}
    ${kv("Credentials",e.credentials.map(x=>`<span class="m">${esc(x)}</span>`).join(" "))}
    ${e.anon?kv("Note",'<span style="color:var(--warn)">also seen without credentials</span>'):""}
    ${e.privileged?kv("Note",'<span style="color:var(--signal)">privileged-looking path</span>'):""}
   </div>
   ${e.roles.length?`<h4>Reached by</h4><div class="kv">${e.roles.map(r=>`<div class="k mono">${esc(r)}</div><div class="v mono">${(sbr[r]||[]).join(", ")||"—"}</div>`).join("")}</div>`:""}
   ${e.params.length?`<h4>Parameters (${e.params.length})</h4><div class="taglist">${e.params.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}
   ${e.referenced_by.length?`<h4>Referenced by (inferred)</h4><div class="taglist">${e.referenced_by.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}
   ${e.called_from.length?`<h4>Called from (observed)</h4><div class="taglist">${e.called_from.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}
   <h4>Evidence: request and response</h4>${(e.evidence||[]).length?'<div class="drv" id="drv"></div>':'<div style="color:var(--faint)">None captured.</div>'}`;
  if((e.evidence||[]).length)rrMount($("#drv"),e.evidence,{vert:true,title:" "});
  $("#drawer").classList.add("on");$("#scrim").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");
}
const NBYID=Object.fromEntries((D.graph.nodes||[]).map(n=>[n.id,n]));
const NODE_KIND={infra:"Infrastructure (external recon)",host:"First-party host",tech:"Technology marker (from response headers)",route:"Page / route",script:"Client script",third_party:"Third party",auth:"Auth scheme",cookie:"Cookie",role:"Role",operation:"GraphQL operation",parameter:"Parameter"};
function openNode(id){
  if(EP.find(x=>x.id===id))return openEp(id);
  const n=NBYID[id];if(!n)return;
  $("#dtitle").innerHTML=`<span class="mono">${esc(n.label)}</span>`;
  const conns=(D.graph.edges||[]).filter(e=>e.s===id||e.d===id).slice(0,30);
  $("#dbody").innerHTML=`<h4>Attributes</h4><div class="kv">
    <div class="k">Kind</div><div class="v">${esc(NODE_KIND[n.type]||humanize(n.type))}</div>
    ${n.detail?`<div class="k">Detail</div><div class="v">${esc(n.detail)}</div>`:""}
   </div>
   ${n.type==="infra"?`<div class="callout" style="margin-top:14px"><span class="i">i</span><p>Collected by external recon (<span class="mono">burp2model osint</span>), not from the capture. It describes the app's public footprint.</p></div>`:""}
   ${conns.length?`<h4>Connections (${conns.length})</h4><div class="taglist">${conns.map(e=>{const o=e.s===id?e.d:e.s;const nn=NBYID[o];const dir=e.s===id?"→":"←";return `<span>${dir} ${esc(humanize(e.type))}: ${esc(nn?nn.label:o)}</span>`;}).join("")}</div>`:""}
   ${(n.evidence||[]).length?'<h4>Evidence: request and response</h4><div class="drv" id="drv"></div>':""}`;
  if((n.evidence||[]).length)rrMount($("#drv"),n.evidence,{vert:true,title:" "});
  $("#drawer").classList.add("on");$("#scrim").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");
}
function closeDrawer(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");}
$("#scrim").onclick=closeDrawer;$("#dclose").onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ---------- wire ---------- */
const RENDER={overview:vOverview,priorities:vPriorities,graph:vGraph,inventory:vEvidence,ask:vAsk,reference:vReference};
function render(){
  renderNav();
  try{if(!(view==="ask"&&(location.hash||"").startsWith("#query=")))history.replaceState(null,"","#"+view);}catch(e){}
  const main=$("#main");
  main.className="m-"+view;
  main.innerHTML=`<section class="view view-${view} on">${(RENDER[view]||vOverview)()}</section>
   <div class="foot">Generated by <b>burp2model ${esc(D.version)}</b>${D.generated?` on ${esc(D.generated)}`:""}. An evidence-backed model of a capture you provided. Not a scanner; nothing here is a vulnerability. · <a href="https://falc0n-researcher.github.io/burp2model/">docs</a></div>`;
  if(view==="graph")initGraph();
  if(view==="ask")initAsk();
  if(view==="overview")initOverview();
  if(view==="priorities")initPriorities();
  if(view==="reference")initReference();
  if(view==="inventory")initEvq();
  // row / card clicks → drawer
  $$("[data-ep]",main).forEach(el=>el.onclick=()=>openEp(el.dataset.ep));
  $$("[data-ev]",main).forEach(el=>el.onclick=()=>openEv(el.dataset.ev));
  $$("th[data-sort]",main).forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
  $$(".chip[data-fk]",main).forEach(ch=>ch.onclick=()=>{const s=filters[ch.dataset.fk];s.has(ch.dataset.fv)?s.delete(ch.dataset.fv):s.add(ch.dataset.fv);render();});
  $$("[data-goto]",main).forEach(b=>b.onclick=()=>{go(b.dataset.goto);render();});
}
$("#q").addEventListener("input",e=>{query=e.target.value.trim();
  // a search jumps to the most relevant list view if on a summary view
  // on the Map, a search highlights matching nodes in place instead
  REF.q=query;if(query&&["overview","ask","priorities"].includes(view))go("surface");
  render();});
addEventListener("keydown",e=>{
  if(e.key==="/"&&!e.metaKey&&!e.ctrlKey&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus();}
});
/* deep link: report.html#priorities opens that view */
/* report.html#query=<urlencoded BQL> opens the console with that query already run */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h.startsWith("query=")){let q="";try{q=decodeURIComponent(h.slice(6));}catch(e){}view="ask";if(q&&q!==qText){qText=q;aNL=null;qErr=null;qRes=null;if(looksBql(q)&&BQLDB)qRun(q);else aNL=askEngine(q);}return true;}
  if(h==="evidence"){view="inventory";return true;}
  if(h==="query"){view="ask";return true;}
  if(LEGACY[h]){go(h);return true;}
  if(RENDER[h]){view=h;return true;}
  return false;
}
fromHash();
addEventListener("hashchange",()=>{const was=view,h=(location.hash||"").slice(1);if(fromHash()&&(view!==was||view==="ask"||LEGACY[h]))render();});
render();
</script>
