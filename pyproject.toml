[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burp2model"
dynamic = ["version"]
description = "Turn a Burp Suite history into an evidence-backed model of a web app."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "falc0n" }]
keywords = ["security", "recon", "burp", "attack-surface", "api-security", "ai", "llm", "appsec"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://falc0n.tech"
Repository = "https://github.com/falc0n-researcher/burp2model"
Documentation = "https://falc0n-researcher.github.io/burp2model/"
Changelog = "https://github.com/falc0n-researcher/burp2model/blob/main/CHANGELOG.md"

[project.scripts]
burp2model = "burp2model.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "burp2model.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burp2model = ["py.typed", "data/*.dat"]
